<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjena · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #2b1e15; --ink-soft: #6b5340; --ink-muted: #a08b73;
    --paper: #f4ebde; --paper-dark: #e8d9c2;
    --accent: #b8672e; --accent-dark: #8f4a1c; --accent-light: #f2d9b8;
    --line: rgba(43,30,21,0.15);
    --success: #6b7c3a; --success-light: #eef2dd;
    --danger: #a63a2c; --danger-light: #f9ece9;
    --metal: #8b7355;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; padding: 1.5rem 1rem 4rem;
    background-image: radial-gradient(circle at 20% 10%, rgba(184,103,46,0.05) 0%, transparent 50%), radial-gradient(circle at 80% 90%, rgba(139,115,85,0.05) 0%, transparent 50%); }

  .container { max-width: 1100px; margin: 0 auto; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 1.25rem; border-bottom: 2px solid var(--ink); margin-bottom: 1.5rem; }
  .header-left .eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; font-weight: 500; }
  .header-left h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--ink); }
  .header-left h1 span { color: var(--accent); font-style: italic; font-weight: 400; display: block; font-size: 14px; letter-spacing: 0.05em; margin-top: 4px; text-transform: uppercase; }
  .header-right { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-muted); text-align: right; }
  .header-right a { color: var(--accent); text-decoration: none; display: inline-block; margin-top: 4px; }

  /* Filtros de periodo */
  .filter-bar { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .filter-bar .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .filter-bar .section-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--metal); margin-bottom: 10px; font-weight: 500; }

  .chip { padding: 8px 14px; background: var(--paper); border: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s; user-select: none; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .chip:hover { border-color: var(--metal); color: var(--ink); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .date-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .date-inputs input[type="date"] { font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  .date-inputs input[type="date"]:focus { border-color: var(--accent); outline: none; background: #fff; }
  .date-inputs span { font-size: 12px; color: var(--ink-muted); }

  .btn-refresh { margin-left: auto; padding: 8px 14px; background: var(--ink); color: #fff; border: none; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .btn-refresh:hover { background: var(--accent); }
  .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .kpi { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 1.1rem 1.25rem; }
  .kpi.ingresos { border-top-color: var(--success); }
  .kpi.gastos { border-top-color: var(--danger); }
  .kpi.utilidad { border-top-color: var(--ink); }
  .kpi-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; font-weight: 500; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1.1; }
  .kpi-value.pos { color: var(--success); }
  .kpi-value.neg { color: var(--danger); }
  .kpi-sub { font-size: 11px; color: var(--ink-muted); margin-top: 6px; }

  /* Cards de contenido */
  .card { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--accent); margin-bottom: 1.25rem; }
  .card-head { padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .card-head h3 { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; color: var(--ink); }
  .card-head .badge { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
  .card-body { padding: 1.25rem 1.5rem; }

  /* P&L */
  .pnl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pnl-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .pnl-table td:last-child { text-align: right; font-family: 'DM Mono', monospace; white-space: nowrap; }
  .pnl-table td:nth-child(2) { text-align: right; font-family: 'DM Mono', monospace; color: var(--ink-muted); font-size: 11px; white-space: nowrap; }
  .pnl-table .indent { padding-left: 24px; color: var(--ink-soft); font-size: 12.5px; }
  .pnl-table .indent td:last-child { color: var(--ink-soft); }
  .pnl-table .subtotal td { border-top: 2px solid var(--ink); font-weight: 600; padding-top: 12px; }
  .pnl-table .total-row td { border-top: 3px double var(--ink); border-bottom: none; padding-top: 14px; padding-bottom: 14px; font-size: 15px; font-weight: 700; background: var(--paper-dark); }
  .pnl-table .total-row.pos td:last-child { color: var(--success); }
  .pnl-table .total-row.neg td:last-child { color: var(--danger); }
  .pnl-table .section-header td { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); padding-top: 16px; padding-bottom: 6px; border-bottom: 1px solid var(--accent); }

  /* Barras horizontales de conceptos */
  .bar-list { display: flex; flex-direction: column; gap: 8px; }
  .bar-item { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; }
  .bar-name { font-size: 12px; color: var(--ink); font-weight: 500; }
  .bar-value { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink-soft); text-align: right; white-space: nowrap; }
  .bar-track { grid-column: 1 / -1; height: 6px; background: var(--paper); position: relative; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.4s ease-out; }
  .bar-fill.ingreso { background: var(--success); }
  .bar-fill.gasto { background: var(--danger); }
  .bar-fill.insumo { background: #c48846; }
  .bar-fill.operativo { background: var(--metal); }
  .bar-fill.inversion { background: #6b5340; }

  /* Split ingresos/gastos side by side */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

  /* Estado */
  .empty { padding: 3rem; text-align: center; color: var(--ink-muted); font-size: 13px; }
  .loading { padding: 3rem; text-align: center; color: var(--ink-muted); font-size: 13px; }
  .loading::after { content: '...'; animation: dots 1s infinite; }
  @keyframes dots { 0%,20% {content:'.';} 40% {content:'..';} 60%,100% {content:'...';} }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .split { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .header-left h1 { font-size: 26px; }
    .filter-bar .row { flex-direction: column; align-items: stretch; }
    .date-inputs { justify-content: space-between; }
    .btn-refresh { margin-left: 0; }
    .kpi-value { font-size: 18px; }
    .card-body { padding: 1rem; }
    .pnl-table { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="header-left">
      <p class="eyebrow">Dashboard · Estado de resultados</p>
      <h1>Arjena<span>Vista financiera</span></h1>
    </div>
    <div class="header-right">
      <div id="current-date"></div>
      <a href="index.html">← Ir al formulario</a>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filter-bar">
    <div class="section-label">Periodo a mostrar</div>
    <div class="row">
      <span class="chip" data-preset="hoy" onclick="setPreset('hoy')">Hoy</span>
      <span class="chip" data-preset="semana" onclick="setPreset('semana')">Esta semana</span>
      <span class="chip active" data-preset="mes" onclick="setPreset('mes')">Este mes</span>
      <span class="chip" data-preset="mesant" onclick="setPreset('mesant')">Mes anterior</span>
      <span class="chip" data-preset="todo" onclick="setPreset('todo')">Todo</span>
      <div class="date-inputs">
        <input type="date" id="fecha-desde" onchange="setPreset('custom')">
        <span>→</span>
        <input type="date" id="fecha-hasta" onchange="setPreset('custom')">
      </div>
      <button class="btn-refresh" id="btn-refresh" onclick="cargarDatos()">↻ Actualizar</button>
    </div>
  </div>

  <div id="contenido">
    <div class="card"><div class="loading">Cargando datos</div></div>
  </div>

</div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz583Sdk5x8397G90G9Ng0BHLFFBdUcyzrFLKbtqWErZKqRor4IApKh8Z21hSS_qZz6yQ/exec';

  var MOVIMIENTOS = [];
  var filtroDesde = null;
  var filtroHasta = null;

  document.getElementById('current-date').textContent =
    new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });

  // ─── Utilidades ────────────────────────────────────────────────────────────
  function fmt(n, decimales) {
    if (n === null || n === undefined || isNaN(n)) return '$0';
    var d = decimales !== undefined ? decimales : 0;
    return '$' + Math.round(n * Math.pow(10, d)) / Math.pow(10, d)
      .toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || isNaN(n)) return '$0';
    return '$' + Math.round(n).toLocaleString('es-MX');
  }

  function fmtPct(n) {
    if (!isFinite(n)) return '—';
    return (n >= 0 ? '' : '') + n.toFixed(1) + '%';
  }

  function parseFecha(f) {
    if (!f) return null;
    if (f instanceof Date) return f;
    // Puede venir como string ISO o como serial
    var d = new Date(f);
    if (isNaN(d.getTime())) return null;
    return d;
  }

  function fechaISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function inicioDia(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function finDia(d)    { var x = new Date(d); x.setHours(23,59,59,999); return x; }

  // ─── Presets de fechas ─────────────────────────────────────────────────────
  function setPreset(preset) {
    document.querySelectorAll('[data-preset]').forEach(el => el.classList.remove('active'));
    var chip = document.querySelector('[data-preset="' + preset + '"]');
    if (chip) chip.classList.add('active');

    var hoy = new Date();
    var desde, hasta;

    if (preset === 'hoy') {
      desde = inicioDia(hoy); hasta = finDia(hoy);
    } else if (preset === 'semana') {
      var dow = hoy.getDay() || 7; // Lunes = 1
      desde = inicioDia(new Date(hoy.getTime() - (dow - 1) * 86400000));
      hasta = finDia(hoy);
    } else if (preset === 'mes') {
      desde = inicioDia(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
      hasta = finDia(hoy);
    } else if (preset === 'mesant') {
      desde = inicioDia(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1));
      hasta = finDia(new Date(hoy.getFullYear(), hoy.getMonth(), 0));
    } else if (preset === 'todo') {
      desde = null; hasta = null;
    } else if (preset === 'custom') {
      var d1 = document.getElementById('fecha-desde').value;
      var d2 = document.getElementById('fecha-hasta').value;
      desde = d1 ? inicioDia(new Date(d1 + 'T00:00:00')) : null;
      hasta = d2 ? finDia(new Date(d2 + 'T00:00:00')) : null;
    }

    filtroDesde = desde;
    filtroHasta = hasta;

    // Actualizar inputs de calendario para reflejar el preset
    if (preset !== 'custom' && desde && hasta) {
      document.getElementById('fecha-desde').value = fechaISO(desde);
      document.getElementById('fecha-hasta').value = fechaISO(hasta);
    } else if (preset === 'todo') {
      document.getElementById('fecha-desde').value = '';
      document.getElementById('fecha-hasta').value = '';
    }

    renderTodo();
  }

  // ─── Carga desde Apps Script ───────────────────────────────────────────────
  function cargarDatos() {
    var btn = document.getElementById('btn-refresh');
    btn.disabled = true;
    btn.textContent = '↻ Cargando...';

    fetch(APPS_SCRIPT_URL + '?action=list', { method: 'GET' })
      .then(function(res) { return res.json(); })
      .then(function(json) {
        if (json.status === 'ok') {
          MOVIMIENTOS = json.data.map(function(r) {
            return {
              fecha: parseFecha(r['Fecha']),
              punto_venta: r['Punto de Venta'] || '',
              tipo: r['Tipo Movimiento'] || '',
              concepto: r['Concepto'] || '',
              cantidad: parseFloat(r['Cantidad']) || 0,
              precio_unitario: parseFloat(r['Precio Unitario']) || 0,
              monto: parseFloat(r['Monto Total']) || 0,
              forma_pago: r['Forma de Pago'] || '',
              notas: r['Notas'] || '',
              tipo_gasto: r['tipo_gasto'] || r['Tipo Gasto'] || r['Tipo de gasto'] || ''
            };
          }).filter(function(m) { return m.fecha; });

          renderTodo();
        } else {
          document.getElementById('contenido').innerHTML =
            '<div class="card"><div class="empty">Error al cargar: ' + (json.message || 'desconocido') + '</div></div>';
        }
      })
      .catch(function(err) {
        document.getElementById('contenido').innerHTML =
          '<div class="card"><div class="empty">No se pudo conectar. Verifica tu internet.</div></div>';
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = '↻ Actualizar';
      });
  }

  // ─── Renderizado ───────────────────────────────────────────────────────────
  function movimientosFiltrados() {
    return MOVIMIENTOS.filter(function(m) {
      if (filtroDesde && m.fecha < filtroDesde) return false;
      if (filtroHasta && m.fecha > filtroHasta) return false;
      return true;
    });
  }

  function calcularResumen(movs) {
    var ingresos = movs.filter(function(m) { return m.tipo === 'Ingreso'; });
    var gastos   = movs.filter(function(m) { return m.tipo === 'Gasto'; });

    var totalIng = ingresos.reduce(function(a,m) { return a + m.monto; }, 0);
    var totalGasto = gastos.reduce(function(a,m) { return a + m.monto; }, 0);

    // Desglose de gastos por tipo
    var insumos    = gastos.filter(function(m) { return m.tipo_gasto === 'Insumo'; });
    var operativos = gastos.filter(function(m) { return m.tipo_gasto === 'Operativo'; });
    var inversion  = gastos.filter(function(m) { return m.tipo_gasto === 'Inversión'; });
    var sinClasif  = gastos.filter(function(m) { return !['Insumo','Operativo','Inversión'].includes(m.tipo_gasto); });

    var totInsumos = insumos.reduce(function(a,m) { return a + m.monto; }, 0);
    var totOperativos = operativos.reduce(function(a,m) { return a + m.monto; }, 0);
    var totInversion = inversion.reduce(function(a,m) { return a + m.monto; }, 0);
    var totSinClasif = sinClasif.reduce(function(a,m) { return a + m.monto; }, 0);

    // Utilidad operativa (excluye inversión)
    var utilidadOperativa = totalIng - totInsumos - totOperativos - totSinClasif;
    // Utilidad neta (incluye inversión)
    var utilidadNeta = totalIng - totalGasto;

    var margenBruto = totalIng > 0 ? ((totalIng - totInsumos) / totalIng) * 100 : 0;
    var margenOperativo = totalIng > 0 ? (utilidadOperativa / totalIng) * 100 : 0;
    var margenNeto = totalIng > 0 ? (utilidadNeta / totalIng) * 100 : 0;

    return {
      movs: movs, ingresos: ingresos, gastos: gastos,
      totalIng: totalIng, totalGasto: totalGasto,
      insumos: insumos, operativos: operativos, inversion: inversion, sinClasif: sinClasif,
      totInsumos: totInsumos, totOperativos: totOperativos, totInversion: totInversion, totSinClasif: totSinClasif,
      utilidadOperativa: utilidadOperativa, utilidadNeta: utilidadNeta,
      margenBruto: margenBruto, margenOperativo: margenOperativo, margenNeto: margenNeto
    };
  }

  function agruparPorConcepto(movs) {
    var map = {};
    movs.forEach(function(m) {
      if (!map[m.concepto]) map[m.concepto] = { total: 0, count: 0 };
      map[m.concepto].total += m.monto;
      map[m.concepto].count++;
    });
    return Object.entries(map).map(function(e) {
      return { nombre: e[0], total: e[1].total, count: e[1].count };
    }).sort(function(a, b) { return b.total - a.total; });
  }

  function renderTodo() {
    var movs = movimientosFiltrados();

    if (movs.length === 0) {
      document.getElementById('contenido').innerHTML =
        '<div class="card"><div class="empty">📭 Sin movimientos en este periodo</div></div>';
      return;
    }

    var r = calcularResumen(movs);

    // KPIs
    var kpisHtml = `
      <div class="kpis">
        <div class="kpi ingresos">
          <div class="kpi-label">Ingresos</div>
          <div class="kpi-value pos">${fmtMoney(r.totalIng)}</div>
          <div class="kpi-sub">${r.ingresos.length} ventas</div>
        </div>
        <div class="kpi gastos">
          <div class="kpi-label">Gastos totales</div>
          <div class="kpi-value neg">${fmtMoney(r.totalGasto)}</div>
          <div class="kpi-sub">${r.gastos.length} registros</div>
        </div>
        <div class="kpi utilidad">
          <div class="kpi-label">Utilidad neta</div>
          <div class="kpi-value ${r.utilidadNeta >= 0 ? 'pos' : 'neg'}">${fmtMoney(r.utilidadNeta)}</div>
          <div class="kpi-sub">Ingresos − gastos</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Margen neto</div>
          <div class="kpi-value ${r.margenNeto >= 0 ? 'pos' : 'neg'}">${fmtPct(r.margenNeto)}</div>
          <div class="kpi-sub">Utilidad / Ingresos</div>
        </div>
      </div>
    `;

    // Estado de resultados (P&L)
    var pnlRows = [];
    pnlRows.push(`<tr class="section-header"><td colspan="3">Ingresos</td></tr>`);
    var conceptosIng = agruparPorConcepto(r.ingresos);
    conceptosIng.forEach(function(c) {
      var pct = r.totalIng > 0 ? (c.total / r.totalIng) * 100 : 0;
      pnlRows.push(`<tr class="indent"><td>${c.nombre}</td><td>${pct.toFixed(1)}%</td><td>${fmtMoney(c.total)}</td></tr>`);
    });
    pnlRows.push(`<tr class="subtotal"><td>Total ingresos</td><td>100.0%</td><td>${fmtMoney(r.totalIng)}</td></tr>`);

    // Insumos
    if (r.totInsumos > 0) {
      pnlRows.push(`<tr class="section-header"><td colspan="3">(−) Costo de insumos</td></tr>`);
      var conceptosIns = agruparPorConcepto(r.insumos);
      conceptosIns.forEach(function(c) {
        var pct = r.totalIng > 0 ? (c.total / r.totalIng) * 100 : 0;
        pnlRows.push(`<tr class="indent"><td>${c.nombre}</td><td>${pct.toFixed(1)}%</td><td>${fmtMoney(c.total)}</td></tr>`);
      });
      var pctIns = r.totalIng > 0 ? (r.totInsumos / r.totalIng) * 100 : 0;
      pnlRows.push(`<tr class="subtotal"><td>Total insumos</td><td>${pctIns.toFixed(1)}%</td><td>${fmtMoney(r.totInsumos)}</td></tr>`);
    }

    // Utilidad bruta
    var utilBruta = r.totalIng - r.totInsumos;
    pnlRows.push(`<tr class="subtotal"><td><strong>Utilidad bruta</strong></td><td>${fmtPct(r.margenBruto)}</td><td><strong>${fmtMoney(utilBruta)}</strong></td></tr>`);

    // Gastos operativos
    if (r.totOperativos > 0 || r.totSinClasif > 0) {
      pnlRows.push(`<tr class="section-header"><td colspan="3">(−) Gastos operativos</td></tr>`);
      var conceptosOp = agruparPorConcepto(r.operativos.concat(r.sinClasif));
      conceptosOp.forEach(function(c) {
        var pct = r.totalIng > 0 ? (c.total / r.totalIng) * 100 : 0;
        pnlRows.push(`<tr class="indent"><td>${c.nombre}</td><td>${pct.toFixed(1)}%</td><td>${fmtMoney(c.total)}</td></tr>`);
      });
      var totOp = r.totOperativos + r.totSinClasif;
      var pctOp = r.totalIng > 0 ? (totOp / r.totalIng) * 100 : 0;
      pnlRows.push(`<tr class="subtotal"><td>Total operativos</td><td>${pctOp.toFixed(1)}%</td><td>${fmtMoney(totOp)}</td></tr>`);
    }

    // Utilidad operativa
    pnlRows.push(`<tr class="subtotal"><td><strong>Utilidad operativa</strong></td><td>${fmtPct(r.margenOperativo)}</td><td><strong>${fmtMoney(r.utilidadOperativa)}</strong></td></tr>`);

    // Inversión
    if (r.totInversion > 0) {
      pnlRows.push(`<tr class="section-header"><td colspan="3">(−) Inversión (compras únicas)</td></tr>`);
      var conceptosInv = agruparPorConcepto(r.inversion);
      conceptosInv.forEach(function(c) {
        var pct = r.totalIng > 0 ? (c.total / r.totalIng) * 100 : 0;
        pnlRows.push(`<tr class="indent"><td>${c.nombre}</td><td>${pct.toFixed(1)}%</td><td>${fmtMoney(c.total)}</td></tr>`);
      });
      var pctInv = r.totalIng > 0 ? (r.totInversion / r.totalIng) * 100 : 0;
      pnlRows.push(`<tr class="subtotal"><td>Total inversión</td><td>${pctInv.toFixed(1)}%</td><td>${fmtMoney(r.totInversion)}</td></tr>`);
    }

    // Utilidad neta
    pnlRows.push(`<tr class="total-row ${r.utilidadNeta >= 0 ? 'pos' : 'neg'}"><td>UTILIDAD NETA</td><td>${fmtPct(r.margenNeto)}</td><td>${fmtMoney(r.utilidadNeta)}</td></tr>`);

    var pnlHtml = `
      <div class="card">
        <div class="card-head">
          <h3>Estado de resultados</h3>
          <span class="badge">${movs.length} movimientos</span>
        </div>
        <div class="card-body">
          <table class="pnl-table">
            <tbody>${pnlRows.join('')}</tbody>
          </table>
        </div>
      </div>
    `;

    // Barras visuales side by side
    var topIngresos = agruparPorConcepto(r.ingresos).slice(0, 6);
    var topGastos = agruparPorConcepto(r.gastos).slice(0, 6);

    function renderBarras(items, tipo, totalRef) {
      if (items.length === 0) return '<div class="empty" style="padding:2rem;">Sin movimientos</div>';
      var max = Math.max.apply(null, items.map(function(i) { return i.total; }));
      return '<div class="bar-list">' + items.map(function(it) {
        var pct = max > 0 ? (it.total / max) * 100 : 0;
        var pctTotal = totalRef > 0 ? (it.total / totalRef) * 100 : 0;
        return `
          <div class="bar-item">
            <div class="bar-name">${it.nombre}</div>
            <div class="bar-value">${fmtMoney(it.total)} <span style="color:var(--ink-muted);">· ${pctTotal.toFixed(0)}%</span></div>
            <div class="bar-track"><div class="bar-fill ${tipo}" style="width:${pct}%;"></div></div>
          </div>
        `;
      }).join('') + '</div>';
    }

    var splitHtml = `
      <div class="split">
        <div class="card">
          <div class="card-head">
            <h3>Top ingresos</h3>
            <span class="badge">${r.ingresos.length} ventas</span>
          </div>
          <div class="card-body">${renderBarras(topIngresos, 'ingreso', r.totalIng)}</div>
        </div>
        <div class="card">
          <div class="card-head">
            <h3>Top gastos</h3>
            <span class="badge">${r.gastos.length} registros</span>
          </div>
          <div class="card-body">${renderBarras(topGastos, 'gasto', r.totalGasto)}</div>
        </div>
      </div>
    `;

    // Desglose por tipo de gasto
    var tiposGastoData = [
      { nombre: 'Insumos', total: r.totInsumos, count: r.insumos.length, clase: 'insumo' },
      { nombre: 'Operativos', total: r.totOperativos + r.totSinClasif, count: r.operativos.length + r.sinClasif.length, clase: 'operativo' },
      { nombre: 'Inversión', total: r.totInversion, count: r.inversion.length, clase: 'inversion' }
    ].filter(function(t) { return t.total > 0; });

    var tipoGastoHtml = '';
    if (tiposGastoData.length > 0 && r.totalGasto > 0) {
      var maxTg = Math.max.apply(null, tiposGastoData.map(function(i) { return i.total; }));
      tipoGastoHtml = `
        <div class="card">
          <div class="card-head">
            <h3>Distribución del gasto</h3>
            <span class="badge">Por tipo</span>
          </div>
          <div class="card-body">
            <div class="bar-list">
              ${tiposGastoData.map(function(t) {
                var pct = maxTg > 0 ? (t.total / maxTg) * 100 : 0;
                var pctTotal = r.totalGasto > 0 ? (t.total / r.totalGasto) * 100 : 0;
                return `
                  <div class="bar-item">
                    <div class="bar-name">${t.nombre}</div>
                    <div class="bar-value">${fmtMoney(t.total)} <span style="color:var(--ink-muted);">· ${pctTotal.toFixed(0)}%</span></div>
                    <div class="bar-track"><div class="bar-fill ${t.clase}" style="width:${pct}%;"></div></div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('contenido').innerHTML = kpisHtml + pnlHtml + splitHtml + tipoGastoHtml;
  }

  // Iniciar
  setPreset('mes');
  cargarDatos();
</script>
</body>
</html>
